<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORACLE AI</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:#faf6ee;color:#222}
h1{font-size:20px} .box{background:#fff;border:1px solid #e6d9bd;border-radius:10px;padding:12px;margin:12px 0}
#log{white-space:pre-wrap;min-height:120px;max-height:50vh;overflow:auto}
input,select,button{font-size:15px;padding:8px;margin:3px 0} input[type=text]{width:70%}
.up{background:#1b7f3b;color:#fff;border:0;border-radius:6px} .down{background:#b3261e;color:#fff;border:0;border-radius:6px}
small{color:#666}
</style></head><body>
<h1>ORACLE AI</h1>
<div class="box"><b>Live price</b> <input id="lsym" value="NIFTY" size="10"> <button onclick="live()">Watch</button>
<div id="liveline">-</div></div>
<div class="box"><div id="log"></div>
<input id="q" type="text" placeholder="Ask: bitcoin future? gold? crude oil? natural gas? Nifty?">
<button onclick="ask()">Send</button></div>

<div class="box"><b>Play: press UP or DOWN</b><br>
<input id="sym" value="BTC" size="8">
<select id="dur"><option>5m</option><option>15m</option><option selected>1h</option><option>1d</option></select>
<button class="up" onclick="play('up')">UP</button> <button class="down" onclick="play('down')">DOWN</button>
<div id="play"></div></div>

<div class="box"><b>Share a chart image</b> (green/red candlesticks)<br>
<input type="file" id="img" accept="image/*"><br>
<label><input type="checkbox" id="consent"> I allow ORACLE to keep this image to improve its training</label><br>
<button onclick="analyze()">Analyze chart</button><div id="chart"></div></div>

<p><small>Educational only, not financial advice. Markets are uncertain and you can lose money. If trading stress feels
overwhelming, Tele-MANAS (India, free 24x7): 14416.</small></p>
<script>
const uid = localStorage.uid || (localStorage.uid = "u" + Math.random().toString(36).slice(2, 10));
let token = null, es = null;
function live(){
  if(es) es.close();
  es = new EventSource("/api/stream/" + encodeURIComponent($("lsym").value) + "?interval=5");
  es.onmessage = e => { const q = JSON.parse(e.data);
    $("liveline").textContent = q.price == null ? "No stored price yet" :
      `${q.price.toLocaleString()}  [${q.status}${q.market === "closed" ? ", market closed" : ""}] ${q.source}, ${q.age_sec}s ago` + (q.warning ? " | " + q.warning : ""); };
  es.onerror = () => { $("liveline").textContent = "reconnecting..."; };
}
const $ = id => document.getElementById(id);
async function ask(){
  const q = $("q").value.trim(); if(!q) return; $("q").value = "";
  $("log").textContent += "\nYou: " + q + "\n";
  try{
    const r = await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
    const j = await r.json(); $("log").textContent += "\nORACLE: " + (j.answer || j.detail) + "\n";
  }catch(e){ $("log").textContent += "\nORACLE: connection problem, please retry.\n"; }
  $("log").scrollTop = 1e9;
}
$("q").addEventListener("keydown", e => { if(e.key === "Enter") ask(); });
async function play(call){
  const r = await fetch("/api/play/call",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user_id:uid,symbol:$("sym").value,call,duration:$("dur").value,image_token:token})});
  const j = await r.json();
  $("play").textContent = r.ok ? `Locked ${call.toUpperCase()} ${j.symbol} at ${j.entry_price} (${j.price_source}). Result after ${$("dur").value}.` : (j.detail || "error");
  token = null;
}
async function analyze(){
  const f = $("img").files[0]; if(!f) return;
  const fd = new FormData(); fd.append("file", f); fd.append("consent", $("consent").checked);
  const r = await fetch("/api/chart/analyze",{method:"POST",body:fd}); const j = await r.json();
  $("chart").textContent = j.ok === false ? j.reason : (j.message + (j.note ? " (" + j.note + ")" : ""));
  token = j.image_token || null;
}
</script></body></html>
